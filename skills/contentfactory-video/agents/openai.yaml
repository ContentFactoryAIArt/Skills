interface:
  display_name: "ContentFactory"
  short_description: "Edit photos, video and 3D with ContentFactory"
  default_prompt: "Use $contentfactory-video through ContentFactory in my preferred language; for a new video, start with the screenwriter, then the director, and produce purposeful moving scenes."
dependencies:
  tools:
    - type: "mcp"
      value: "content-factory"
      description: "Verified ContentFactory Media, Generate and Compose tools"
      transport: "streamable_http"
      url: "https://content-factory.art/mcp"
policy:
  allow_implicit_invocation: true
